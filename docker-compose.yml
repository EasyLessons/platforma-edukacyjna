services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:3000
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # /api/chat sprawdza token w backendzie z wnetrza kontenera - tam localhost to sam frontend
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  whiteboard-sync:
    build: ./whiteboard-sync
    ports:
      - '1234:1234'
    volumes:
      - ./whiteboard-sync:/app
      - /app/node_modules
    environment:
      - PORT=1234
