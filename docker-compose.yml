services:
  backend:
    build: ./backend
    ports:
      - '8000:8000'
    volumes:
      - ./backend:/app
    env_file:
      - ./backend/.env
    environment:
      - FRONTEND_URL=http://localhost:3000
      - PORT=8000
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - redis

  frontend:
    build: .
    ports:
      - '3000:3000'
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    env_file:
      - ./.env.local
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - WATCHPACK_POLLING=true
      - CHOKIDAR_USEPOLLING=true
      # /api/chat sprawdza token w backendzie z wnetrza kontenera - tam localhost to sam frontend
      - BACKEND_INTERNAL_URL=http://backend:8000
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'

  # PROTOTYP (gałąź proto/excalidraw-yjs): serwer Yjs bez auth dla /proto-excalidraw/*.
  # Nie startuje domyślnie - tylko `docker compose --profile proto up proto-yjs`.
  # Prościej lokalnie: `npm run proto:yjs` (ten sam skrypt, bez kontenera).
  proto-yjs:
    image: node:20-alpine
    profiles: ['proto']
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund --ignore-scripts && node scripts/proto-yjs-server.mjs"
    ports:
      - '1235:1235'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - PROTO_YJS_PORT=1235

  whiteboard-sync:
    build: ./whiteboard-sync
    ports:
      - '1234:1234'
    volumes:
      - ./whiteboard-sync:/app
      - /app/node_modules
    environment:
      - PORT=1234
      - BACKEND_URL=http://backend:8000
    depends_on:
      - backend
